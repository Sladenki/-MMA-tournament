<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Секретарь ММА</title>
  <link rel="stylesheet" href="/static/app.css?v=7">
</head>
<body>
  <aside class="rail">
    <div class="brand">
      <strong>Секретарь ММА</strong>
      <span id="brand-sub">турнир</span>
    </div>
    <nav id="nav">
      <button data-view="setup" class="active"><i>1</i> Реквизиты</button>
      <button data-view="people"><i>2</i> Участники</button>
      <button data-view="weigh"><i>3</i> Взвешивание</button>
      <button data-view="cats"><i>4</i> Категории</button>
      <button data-view="brackets"><i>5</i> Сетки</button>
      <button data-view="bouts"><i>6</i> Бои</button>
      <button data-view="results"><i>7</i> Итоги</button>
      <button data-view="docs"><i>8</i> Документы</button>
    </nav>
    <div class="rail-foot">
      <button id="btn-undo" type="button">Отменить последнее</button>
      <button id="btn-backup" type="button">Сохранить копию</button>
      <label class="file-btn">Открыть копию<input type="file" id="file-import" accept=".json" hidden></label>
      <a class="about-link" href="/static/about.html" target="_blank" rel="noopener">Автор</a>
    </div>
  </aside>

  <div class="wrap">
    <header class="top">
      <div>
        <h1 id="page-title">Реквизиты</h1>
        <p id="page-hint">Название турнира, судьи, возрасты, дивизионы и веса</p>
      </div>
      <span id="save-dot" class="saved">сохранено</span>
    </header>
    <section id="view"></section>
  </div>

  <div id="modal" class="modal hidden" role="dialog">
    <div class="modal-card">
      <header>
        <h3 id="modal-title"></h3>
        <button class="icon" id="modal-close" type="button" aria-label="Закрыть">×</button>
      </header>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
